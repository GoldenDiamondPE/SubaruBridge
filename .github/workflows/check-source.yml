name: Source and protocol checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit public source boundary
        run: python3 scripts/audit_public_source.py . --verify-inventory
      - name: Boundary regressions
        run: python3 -m unittest discover -s tests -v
      - name: Check browser demo matches original UI source
        run: python3 scripts/build_web_demo.py --check
      - name: Install pinned Rust
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Native protocol regressions
        working-directory: rust
        run: cargo test --locked
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '9.4.1'
      - name: Install pinned Rust and Android targets
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup target add --toolchain 1.90.0 aarch64-linux-android x86_64-linux-android
      - name: Install Android SDK and components
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-36 ndk;28.2.13676358'
      - name: Build from source
        run: gradle -p android --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx3g' assembleDebug assembleDebugAndroidTest
